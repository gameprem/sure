              message: Sure ทำเส้นทาง PDF แบบรูปภาพหรือเอกสารเนทีฟผ่านโมเดลที่ตั้งค่าไว้ให้เสร็จไม่ได้ ไม่มีข้อมูลลูกค้าถูกส่ง ความล้มเหลวถูกบันทึกใน การตั้งค่า → บันทึกดีบัก และ Rails.logger
            vector_probe_failed:
              title: การตรวจสอบสดของการค้นหาเอกสารล้มเหลว
              message: Sure ยืนยัน vector store ที่เลือกและบริการ embedding ที่จำเป็นทุกตัวไม่ได้ ความล้มเหลวถูกบันทึกใน การตั้งค่า → บันทึกดีบัก และ Rails.logger
            pgvector_extension_not_enabled:
              title: ไม่ได้เปิดส่วนขยาย vector ของ PostgreSQL
              message: เลือกอะแดปเตอร์ pgvector แล้ว แต่ PostgreSQL ยังไม่ได้เปิดส่วนขยาย vector สำหรับฐานข้อมูลนี้ ใช้อิมเมจ PostgreSQL ที่มี pgvector แล้วเปิดส่วนขยายในฐานะเจ้าของฐานข้อมูลหรือ superuser และรัน migration ใหม่ด้วย VECTOR_STORE_PROVIDER=pgvector
            pgvector_table_not_found:
              title: ไม่พบตาราง vector_store_chunks
