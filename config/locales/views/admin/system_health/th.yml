            settings_origin:
              title: การตั้งค่าใดต้องรีสตาร์ท?
              database_backed: "การตั้งค่าผู้ให้บริการ โมเดล และคีย์ API ที่เปลี่ยนใน การตั้งค่า → การโฮสต์เอง ถูกเก็บในฐานข้อมูล rails-settings-cached ทำให้แคชที่ใช้ร่วมกันเป็นโมฆะเมื่อเขียน ทั้งเว็บและ worker จึงได้ค่าใหม่สำหรับคำขอหรืองานในคิวถัดไป -- ไม่ต้องรีสตาร์ท"
              env_backed: "การตั้งค่า embedding และค่าใดก็ตามที่ตั้งผ่านตัวแปรสภาพแวดล้อมเท่านั้น ถูกกำหนดตอนแต่ละคอนเทนเนอร์เริ่มทำงาน Rails เปลี่ยนสภาพแวดล้อมของคอนเทนเนอร์อื่นไม่ได้ การเปลี่ยนค่าเหล่านี้จึงต้องรีสตาร์ทหรือสร้างบริการเว็บและ worker ใหม่ทั้งคู่ -- และเครื่องมือการติดตั้งที่รีสตาร์ทเพียงตัวเดียว (การเปิดตัวบางส่วน Secret ที่อัปเดตโดยไม่รีสตาร์ท pod) จะไม่รับการเปลี่ยนแปลง"
