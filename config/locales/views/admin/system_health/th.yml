            missing_vector_store:
              title: ยังไม่ได้ตั้งค่า vector store
              message: เอกสารที่อัปโหลดจะจัดทำดัชนีหรือค้นหาไม่ได้จนกว่าจะตั้งค่าอะแดปเตอร์ vector-store และข้อกำหนดของมัน
