              message: Sure คิวรีตาราง chunks ของ pgvector ไม่ได้ ตรวจสอบสิทธิ์ PostgreSQL ส่วนขยาย vector และ migration ของ vector_store_chunks ความล้มเหลวถูกบันทึกใน การตั้งค่า → บันทึกดีบัก และ Rails.logger
            embedding_dimensions_mismatch:
