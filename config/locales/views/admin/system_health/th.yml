            title: การตั้งค่าในเครื่องที่แนะนำ
            description: รัน LLM ผ่าน endpoint ที่เข้ากันได้กับ OpenAI ในเครื่องของคุณ เก็บเวกเตอร์เอกสารใน pgvector และชี้การตั้งค่า embedding ไปยัง endpoint embeddings ที่เข้ากันได้กับ OpenAI อิมเมจ PostgreSQL ต้องมีส่วนขยาย vector และมิติ embedding ต้องตรงกับโมเดลที่เลือก
