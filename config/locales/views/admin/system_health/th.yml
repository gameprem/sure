              message: endpoint embedding ไม่ตอบก่อน AI_HEALTH_PROBE_TIMEOUT เพิ่มเวลาหมดอายุการตรวจสุขภาพนั้นหากผู้ให้บริการช้า แล้วรีสตาร์ท Sure เพื่อให้สภาพแวดล้อมคงอยู่ในทุกโพรเซส หากการเรียกแชต AI ปกติก็หมดเวลาด้วย ให้เพิ่ม OPENAI_REQUEST_TIMEOUT แยกต่างหาก
            embedding_probe_failed:
              title: การตรวจสอบสดของ embedding ล้มเหลว
              message: Sure สร้าง embedding ทดสอบสั้น ๆ ผ่าน endpoint และโมเดลที่ตั้งค่าไว้ไม่ได้ ตรวจสอบ EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN และบันทึกของผู้ให้บริการ embedding ความล้มเหลวถูกบันทึกใน การตั้งค่า → บันทึกดีบัก และ Rails.logger
