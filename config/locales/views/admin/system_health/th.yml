              not_configured: "แบ็กเอนด์พื้นที่เก็บข้อมูลที่เลือกไม่มีการตั้งค่าที่ตรงกัน การอัปโหลดไฟล์อาจใช้ไม่ได้"
              incomplete: "การตั้งค่าพื้นที่เก็บข้อมูลที่จำเป็นขาดหายหรือไม่สมบูรณ์ การอัปโหลดหรือดึงไฟล์อาจใช้ไม่ได้"
              not_checked: "แบ็กเอนด์นี้ใช้การค้นหาข้อมูลรับรองภายนอกหรือการตั้งค่าที่กำหนดเอง ตรวจสอบการเข้าถึงจากการตั้งค่าเหล่านี้เพียงอย่างเดียวไม่ได้"
            guidance: "ตรวจสอบ ACTIVE_STORAGE_SERVICE และการตั้งค่าการติดตั้งของแบ็กเอนด์ที่เลือก ดิสก์ในเครื่องต้องใช้พื้นที่เก็บข้อมูลถาวรที่ใช้ร่วมกันระหว่างบริการเว็บและ worker การเปลี่ยนแบ็กเอนด์ไม่ย้ายไฟล์ที่มีอยู่ วางแผนการย้ายแยกต่างหาก"
            issues:
