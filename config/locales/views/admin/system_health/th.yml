            llm_model_not_available:
              title: โมเดล AI ที่ตั้งค่าไว้ไม่พร้อมใช้งาน
              message: endpoint ตอบ แต่ไม่ได้แสดงหรือให้บริการโมเดลที่ตั้งค่าไว้ เลือกโมเดลที่ใช้งานอยู่ของผู้ให้บริการที่เลือก แล้วรันการตรวจสอบอีกครั้ง สำหรับ Gemini ผ่านชั้นแปลที่เข้ากันได้กับ OpenAI ให้ใช้โมเดลที่รองรับอยู่ปัจจุบัน เช่น gemini-3.8-flash
            pdf_text_extraction_failed:
